spring.application.name=incidencias

# --- MySQL ---
spring.datasource.url= jdbc:mysql://localhost:3306/incidencias_lima?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
spring.datasource.username= root
spring.datasource.password= contrasena
server.port=8080
# --- JPA ---
# validate: Hibernate comprueba que las tablas creadas con database/schema.sql coinciden con las entidades.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# --- JWT (HS256). En produccion define JWT_SECRET con 32+ caracteres aleatorios ---
app.jwt.secret=${JWT_SECRET:incidencias-lima-clave-secreta-desarrollo-2026-xyz}
app.jwt.expiration-minutes=120

# --- Primer ADMIN (se crea al arrancar si no existe). 
app.admin.email=admin@incidencias.pe
app.admin.password=Admin12345
app.admin.nombre=Administrador


